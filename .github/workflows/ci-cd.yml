name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:

jobs:

  sonar:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Create application-local.yml (dummy values, no external call is made during tests)
        run: |
          cat > src/main/resources/application-local.yml <<'YAML'
          spring:
            datasource:
              url: "jdbc:h2:mem:notezendb"
              driverClassName: "org.h2.Driver"
              username: "sa"
              password:
            jpa:
              database-platform: org.hibernate.dialect.H2Dialect
              hibernate:
                ddl-auto: update
            h2:
              console:
                enabled: false
          google:
            client-id: "dummy-client-id"
            client-secret: "dummy-client-secret"
            redirect-uri: "http://localhost:8080/api/google/callback"
            ai:
              api:
                key: "dummy-google-ai-key"
          jwt:
            secret: "dummy-ci-jwt-secret-at-least-32-characters-long"
          stripe:
            api-key: "sk_test_dummy"
            webhook-secret: "whsec_dummy"
            pricing:
              starter:
                stripePriceId: "price_dummy_starter"
                trialDays: 7
              professional:
                stripePriceId: "price_dummy_professional"
                trialDays: 7
          front:
            url: "http://localhost:4200/"
          app:
            mock-user-email: "dev@notezen.fr"
          logging:
            level:
              ROOT: INFO
          YAML

      - name: Build + Tests + SonarCloud Scan
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DLOG_PATH=target/logs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-deploy:
    name: Build et Deploy VPS
    needs: sonar
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Create application-prod.yml
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.APP_PROD_YML }}" > /opt/notezen/config/application-prod.yml

      - name: Build Spring Boot
        run: mvn -B clean package -DskipTests

      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/*.jar"
          target: "/tmp/deploy"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mv /tmp/deploy/target/*.jar /opt/notezen/backend/notezen.jar
            sudo systemctl restart notezen